{% set name = "heartrate" %}
{% set version = "0.2.2" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/heartrate-{{ version }}.tar.gz
  sha256: a51841684521be6eaaad6ed7f03a3834f40a6492b7c823e9f50efe41ac5aa077

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - asttokens
    - executing
    - flask
    - pygments
    - python >={{ python_min }}

test:
  imports:
    - heartrate
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/alexmojaki/heartrate
  summary: Simple real time visualisation of the execution of a Python program.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thewchan
